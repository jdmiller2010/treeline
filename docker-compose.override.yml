# Development only (Compose loads this file automatically; the production stack in
# deploy/ doesn't). It mounts the source into the containers, so a code change needs
# `./dev restart`, not an image rebuild. Rebuild (`./dev up`) only when
# requirements.txt or a Dockerfile changes.
services:
  controller:
    volumes:
      - ./controller/treeline:/app/treeline:ro
      - ./controller/tests:/app/tests:ro
      - ./controller/run_controller.py:/app/run_controller.py:ro
      - ./controller/backup.py:/app/backup.py:ro
      - ./controller/make_vapid.py:/app/make_vapid.py:ro
      - ./data:/data
  api:
    environment:
      # The address in the pairing QR code (set TREELINE_PUBLIC_ORIGIN in .env, e.g. https://192.168.1.20:8443).
      TREELINE_PUBLIC_ORIGIN: ${TREELINE_PUBLIC_ORIGIN:-}
    volumes:
      - ./controller/treeline:/app/treeline:ro
      - ./data:/data
      - ./data/generated:/generated
      - ./web:/web/site:ro
      - ./design/ui:/web/ui:ro
  testphones:
    volumes:
      - ./testphones/run_scenarios.py:/tests/run_scenarios.py:ro
  webtests:
    volumes:
      - ./web/tests:/t:ro

  # HTTPS for devices on your network (the softphone's microphone needs it). First start makes a
  # local certificate authority in data/caddy; docs/LOCAL_HTTPS.md says how to trust it on a phone.
  # Set TREELINE_LAN_IP in .env to this machine's LAN address (the certificate is made for it).
  caddy:
    image: caddy:2
    network_mode: host
    depends_on: [api, asterisk]
    environment:
      TREELINE_LAN_IP: ${TREELINE_LAN_IP:-localhost}
      XDG_DATA_HOME: /data
    volumes:
      - ./deploy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data/caddy
    restart: unless-stopped
