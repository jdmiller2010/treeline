<!-- @dsCard group="Softphone" height=420 subtitle="Tap the card file (or use the arrow keys) to turn to the next card." -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>CardFile — Treeline</title></head>
<body>
<div id="root" class="tl-root"></div>
<script>
  var T = window.Treeline, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', {style:{padding:'24px', display:'flex', gap:'40px', alignItems:'flex-end', flexWrap:'wrap'}},
      h('div', {style:{width:'260px'}}, h(T.CardFile, {id:'cf', contacts:[{name:'The Parks', number:'3317'}, {name:'Grandma Jo', number:'5520'}, {name:'Maya’s house', number:'2094'}]})),
      h('div', {style:{width:'200px'}}, h(T.CardFile, {id:'cf-empty', contacts:[]}))));
</script>
</body>
</html>
