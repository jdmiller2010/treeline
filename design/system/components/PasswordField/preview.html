<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>PasswordField — Treeline</title></head>
<body>
<div id="root" class="tl-root"></div>
<script>
  var T = window.Treeline, h = React.createElement;
  function render(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }
  render(h('div', {className:'tl-demo', style:{gap:'32px', alignItems:'flex-start'}},
    h(T.PasswordField, {label:'Password', id:'p-pw', defaultValue:'treehouse-42'}),
    h(T.PasswordField, {label:'New password', id:'p-npw', autoComplete:'new-password', hint:'At least 10 characters.'})));
</script>
</body>
</html>
