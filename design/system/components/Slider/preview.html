<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Slider — Treeline</title></head>
<body>
<div id="root" class="tl-root"></div>
<script>
  var T = window.Treeline, h = React.createElement;
  function render(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }
  render(h('div', {className:'tl-demo', style:{gap:'48px', alignItems:'flex-start'}},
    h('div', {style:{width:'320px'}}, h(T.Slider, {label:'Ringer volume', id:'p-ring-v', min:0, max:10, defaultValue:6, minLabel:'Quiet', maxLabel:'Loud'})),
    h('div', {style:{width:'320px'}}, h(T.Slider, {label:'Longest call', id:'p-len', min:5, max:60, step:5, defaultValue:30, unit:'min', format: function (v) { return v + ' min'; }}))));
</script>
</body>
</html>
