<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toast — Treeline</title></head>
<body>
<div id="root" class="tl-root"></div>
<script>
  var T = window.Treeline, h = React.createElement;
  function render(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }
  render(h('div', {className:'tl-stack', style:{padding:'24px', alignItems:'flex-start'}},
    h(T.Toast, null, 'Request sent to the Chen house'),
    h(T.Toast, {tone:'success', action:'Undo'}, 'Riley removed'),
    h(T.Toast, {tone:'warning'}, 'Sam’s phone is offline')));
</script>
</body>
</html>
