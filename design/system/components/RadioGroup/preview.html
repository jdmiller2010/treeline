<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>RadioGroup — Treeline</title></head>
<body>
<div id="root" class="tl-root"></div>
<script>
  var T = window.Treeline, h = React.createElement;
  function render(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }
  render(h('div', {className:'tl-demo', style:{gap:'48px', alignItems:'flex-start'}},
    h(T.RadioGroup, {label:'Who can call Sam', name:'p-who', defaultValue:'approved', options:[{value:'approved', label:'Approved friends only', description:'Both families said yes.'}, {value:'family', label:'Approved friends and family', description:'Grandparents and relatives you add.'}, {value:'nobody', label:'Nobody right now', description:'The phone can still call you.'}]}),
    h(T.RadioGroup, {label:'Ring style', name:'p-ring', variant:'cards', defaultValue:'classic', options:[{value:'classic', label:'Classic bell', description:'The rotary phone’s own ring.'}, {value:'soft', label:'Soft chime', description:'Gentler, for little sisters asleep.'}]})));
</script>
</body>
</html>
