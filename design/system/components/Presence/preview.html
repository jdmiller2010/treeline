<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Presence — Treeline</title></head>
<body>
<div id="root" class="tl-root"></div>
<script>
  var T = window.Treeline, h = React.createElement;
  function render(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }
  var s = ['available','ringing','on-call','quiet','paused','offline'];
  render(h('div', {className:'tl-demo', style:{gap:'12px 24px'}}, s.map(function(x){ return h(T.Presence, {key:x, status:x}); }),
    h('p', {className:'tl-demo__label'}, 'With icons'),
    s.map(function(x){ return h(T.Presence, {key:'i'+x, status:x, showIcon:true}); })));
</script>
</body>
</html>
