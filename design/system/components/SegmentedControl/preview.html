<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SegmentedControl — Treeline</title></head>
<body>
<div id="root" class="tl-root"></div>
<script>
  var T = window.Treeline, h = React.createElement;
  function render(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }
  render(h('div', {className:'tl-stack tl-stack--group', style:{padding:'24px', maxWidth:'440px'}},
    h(T.SegmentedControl, {label:'Show calls from', name:'p-range', defaultValue:'today', options:[{value:'today', label:'Today'}, {value:'week', label:'This week'}, {value:'all', label:'All'}]}),
    h(T.SegmentedControl, {label:'Phone mode', name:'p-mode', fullWidth:true, defaultValue:'quiet', options:[{value:'on', label:'On', icon:'phone'}, {value:'quiet', label:'Quiet', icon:'moon'}, {value:'paused', label:'Paused', icon:'pause'}]})));
</script>
</body>
</html>
