<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TimeField — Treeline</title></head>
<body>
<div id="root" class="tl-root"></div>
<script>
  var T = window.Treeline, h = React.createElement;
  function render(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }
  render(h('div', {className:'tl-demo', style:{gap:'32px', alignItems:'flex-start'}},
    h(T.TimeField, {label:'Bedtime', id:'p-bed', defaultValue:'20:00', hint:'Calls wait after this.'}),
    h(T.TimeField, {label:'Wake up', id:'p-wake', defaultValue:'07:00'})));
</script>
</body>
</html>
