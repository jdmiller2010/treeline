<!-- Treeline · AppShell
     The frame every parent screen lives in: a top bar, navigation and the main area, rearranged for phones, tablets and desktop.
     Needs css/tokens.css and css/treeline.css and js/treeline.js.
     Rules and notes: components/AppShell.md -->

<!-- Full screen: bar, page, nav and a closed sheet -->
<div class="tl-app">
  <div class="tl-app__layout">
    <header class="tl-appbar">
      <h1 class="tl-appbar__title">Home</h1>
      <div class="tl-appbar__actions">
        <button type="button" data-tl-open="add-friend" class="tl-btn tl-btn--secondary tl-btn--md tl-btn--collapse">
          <svg class="tl-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span class="tl-btn__label">Add friend</span>
        </button>
        <span class="tl-avatar tl-avatar--sm tl-avatar--petal" role="img" aria-label="Jordan Bennett">JB</span>
      </div>
    </header>
    <main class="tl-app__main">
      <div class="tl-page">…one of the four page templates…</div>
    </main>
    <nav class="tl-nav" aria-label="Main">
      <div class="tl-nav__inner">
        <div class="tl-nav__brand">
          <a class="tl-brand" href="#" aria-label="Treeline home">

            <span class="tl-brand__word">Treeline</span>
          </a>
        </div>
        <ul class="tl-nav__list">
          <li>
            <a class="tl-nav__item" href="#home" aria-current="page">

              <span class="tl-nav__label">Home</span>

          </li>
          <li>
            <a class="tl-nav__item" href="#friends">

            </a>
          </li>
          <li>
            <a class="tl-nav__item" href="#calls">
              <svg class="tl-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9.2V8.4C3.5 6.2 7.3 4.5 12 4.5s8.5 1.7 8.5 3.9v.8a1 1 0 0 1-1 1H17a1 1 0 0 1-1-1V8H8v1.2a1 1 0 0 1-1 1H4.5a1 1 0 0 1-1-1z"/><path d="M8 10.2h8l3.5 8.3a1 1 0 0 1-.9 1.5H5.4a1 1 0 0 1-.9-1.5z"/><circle cx="12" cy="15.2" r="2.6"/></svg>
              <span class="tl-nav__label">Calls</span>
            </a>
          </li>
          <li>
            <a class="tl-nav__item" href="#quiet">
              <svg class="tl-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
              <span class="tl-nav__label">Quiet hours</span>
            </a>
          </li>
        </ul>
        <div class="tl-nav__foot">
          <div class="tl-split">
            <div class="tl-stack tl-stack--tight">
              <span class="tl-nav__house">Bennett house</span>
              <span class="tl-nav__meta">2 kids · 2 phones</span>
            </div>
            <button type="button" aria-label="Settings" title="Settings" class="tl-iconbtn tl-btn--quiet tl-iconbtn--sm">
              <svg class="tl-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            </button>
          </div>
        </div>
      </div>
    </nav>
  </div>
  <div class="tl-sheet-scrim" id="add-friend" hidden="">
    <div class="tl-sheet" role="dialog" aria-modal="true" aria-labelledby="add-friend-title">
      <span class="tl-sheet__grabber" aria-hidden="true">
      </span>
      <div class="tl-sheet__head">
        <h2 class="tl-sheet__title" id="add-friend-title">Add a friend</h2>
        <button type="button" aria-label="Close" title="Close" class="tl-iconbtn tl-btn--quiet tl-iconbtn--md tl-sheet__close">
          <svg class="tl-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <p class="tl-sheet__body">We’ll ask their family to approve.</p>
      <div class="tl-actions">
        <button type="button" data-tl-close="" class="tl-btn tl-btn--secondary tl-btn--md">
          <span class="tl-btn__label">Cancel</span>
        </button>
        <button type="button" data-tl-close="" class="tl-btn tl-btn--primary tl-btn--md">
          <span class="tl-btn__label">Send request</span>
        </button>
      </div>
    </div>
  </div>
</div>
