<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48" width="128" height="96"><style>.tl-loader__wind{stroke-dasharray:18 60;animation:tl-wind 2.4s ease-in-out infinite}.tl-loader__wind--2{animation-delay:-1.2s}@keyframes tl-wind{from{stroke-dashoffset:78;opacity:0}30%{opacity:1}70%{opacity:1}to{stroke-dashoffset:-20;opacity:0}}.tl-loader__leaf{transform-box:view-box;animation:tl-drift 2.4s cubic-bezier(.4,.1,.4,1) infinite;opacity:0}.tl-loader__leaf--2{animation-delay:-.8s}.tl-loader__leaf--3{animation-delay:-1.6s}@keyframes tl-drift{0%{transform:translate(2px,26px) rotate(-40deg);opacity:0}15%{opacity:1}45%{transform:translate(26px,14px) rotate(70deg)}70%{transform:translate(42px,24px) rotate(150deg);opacity:1}100%{transform:translate(62px,16px) rotate(250deg);opacity:0}}@media (prefers-reduced-motion:reduce){.tl-loader__wind{animation:none;stroke-dasharray:none}.tl-loader__leaf{animation:none;opacity:1}.tl-loader__leaf--1{transform:translate(18px,22px) rotate(-30deg)}.tl-loader__leaf--2{transform:translate(32px,14px) rotate(40deg)}.tl-loader__leaf--3{transform:translate(46px,26px) rotate(110deg)}}</style><path class="tl-loader__wind" fill="none" stroke="#5e5546" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" d="M4 16C14 11 26 12 36 17S54 22 60 18"/><path class="tl-loader__wind tl-loader__wind--2" fill="none" stroke="#5e5546" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" d="M2 30C12 26 22 27 32 31S50 35 58 32"/><g class="tl-loader__leaf tl-loader__leaf--1" ><path fill="rgba(108, 160, 118, 0.20)" transform="translate(1.2 1) scale(.62)" d="M0 -10C6 -5 6 5 0 10C-6 5 -6 -5 0 -10Z"/><path fill="#2e7051" transform="scale(.55)" d="M0 -10C6 -5 6 5 0 10C-6 5 -6 -5 0 -10Z"/></g><g class="tl-loader__leaf tl-loader__leaf--2" ><path fill="rgba(108, 160, 118, 0.20)" transform="translate(1.2 1) scale(.62)" d="M0 -10C6 -5 6 5 0 10C-6 5 -6 -5 0 -10Z"/><path fill="#2e7051" transform="scale(.55)" d="M0 -10C6 -5 6 5 0 10C-6 5 -6 -5 0 -10Z"/></g><g class="tl-loader__leaf tl-loader__leaf--3" ><path fill="rgba(108, 160, 118, 0.20)" transform="translate(1.2 1) scale(.62)" d="M0 -10C6 -5 6 5 0 10C-6 5 -6 -5 0 -10Z"/><path fill="#2e7051" transform="scale(.55)" d="M0 -10C6 -5 6 5 0 10C-6 5 -6 -5 0 -10Z"/></g></svg>
