# Builds the Asterisk that production runs (asterisk/build/README.md, docs/SUPPLY_CHAIN.md). The build compiles
# third-party code, so it follows the CLAUDE.md exception: only `asterisk/build/run-build.sh`, inside a container with no
# network, on source whose sha256 and signature were checked; no job that compiles has a write token, an id-token, an
# environment or a secret.
#
#   build, rebuild   two independent builds of the same inputs
#   compare          fails unless the two artifacts are byte for byte the same
#   publish          by hand from main only: attests where the bytes came from and puts them on a prerelease. It checks
#                    nothing out and builds nothing. A human then records the hash (scripts/asterisk_build.py write-lock).
#
# `pull_request` (never `pull_request_target`): a pull request's build runs with a read-only token and no secrets.
name: asterisk build

on:
  pull_request:
    paths:
      - "asterisk/build/**"
      - "scripts/asterisk_build.py"
      - ".github/workflows/asterisk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inputs:
    name: the build's inputs are well formed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -W error::ResourceWarning -m unittest -v scripts/test_asterisk_build.py
      - run: python3 scripts/asterisk_build.py check

  build:
    name: build (1 of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - run: asterisk/build/run-build.sh dist/asterisk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: asterisk-build-1
          path: dist/asterisk/
          if-no-files-found: error
          retention-days: 14

  rebuild:
    name: build (2 of 2, for the comparison)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - run: asterisk/build/run-build.sh dist/asterisk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: asterisk-build-2
          path: dist/asterisk/
          if-no-files-found: error
          retention-days: 14

  compare:
    name: the two builds are identical
    needs: [build, rebuild]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: asterisk-build-1
          path: one
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: asterisk-build-2
          path: two
      - name: Same bytes, same bill of materials, and the same hash as artifact.lock when there is one
        run: |
          set -euo pipefail
          id="$(grep -E '^BUILD_ID=' asterisk/build/sources.lock | cut -d= -f2-)"
          a="one/asterisk-$id.tar.gz"; b="two/asterisk-$id.tar.gz"
          sha="$(sha256sum "$a" | cut -d' ' -f1)"
          if ! cmp "$a" "$b"; then
            echo "::error::two builds of the same inputs differ: $sha vs $(sha256sum "$b" | cut -d' ' -f1)"; exit 1
          fi
          cmp "one/asterisk-$id.bom.txt" "two/asterisk-$id.bom.txt"
          if [ -f asterisk/build/artifact.lock ]; then
            want="$(grep -E '^ARTIFACT_SHA256=' asterisk/build/artifact.lock | cut -d= -f2-)"
            [ "$want" = "$sha" ] || { echo "::error::artifact.lock says $want but this tree builds $sha"; exit 1; }
          fi
          { echo "### asterisk-$id.tar.gz"; echo; echo "sha256 \`$sha\`"; echo; echo '```'; cat "one/asterisk-$id.bom.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: publish the artifact (by hand, from main)
    needs: [compare]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: asterisk-build-1
          path: out
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8   # v4.2.2
        with:
          subject-path: out/asterisk-*.tar.gz
      - name: A prerelease named asterisk-<id>, which never counts as the latest release (the deploy agent reads that)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          f="$(ls out/asterisk-*.tar.gz)"; tag="$(basename "$f" .tar.gz)"
          sha="$(sha256sum "$f" | cut -d' ' -f1)"
          gh release create "$tag" "$f" "out/$tag.bom.txt" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "$tag" --notes "Asterisk build for Treeline. sha256 $sha. Built twice with identical results. Not a Treeline release: the deploy agent only installs v* releases."
