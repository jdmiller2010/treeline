<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treeline</title>
<meta name="description" content="Treeline: safe calls for neighborhood kids, with parents holding the keys.">
<meta name="theme-color" content="#f0e7d3">
<link rel="stylesheet" href="/ui/css/tokens.css">
<link rel="stylesheet" href="/ui/css/treeline.css">
<link rel="icon" href="/ui/logo/exports/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/ui/logo/exports/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/ui/logo/exports/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treeline">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  /* Empty message slots take no room, so they don't add a gap in a form. */
  [data-error]:empty, [id$="-error"]:empty, #dev-note:empty { display: none; }
  /* On a phone the logo is in the title bar from the very top, on the same row as the pause button and the avatar. On Home the bar says
     "Treeline" (with the tagline) until the big treehouse name has scrolled up to it; then the name takes that place and the logo stays.
     From 768 up the side rail carries the logo, so none of this shows. */
  .tl-appbar__brand { display: none; }
  .tl-appbar__brand .tl-brand__word { display: none; }
  .tl-appbar__brand .tl-brand__mark { width: 36px; height: auto; }
  .tl-appbar__text { flex: 1; min-width: 0; display: grid; align-items: center; container: bartext / inline-size; }
  .tl-appbar__text > * { grid-area: 1 / 1; min-width: 0; }
  .tl-appbar__title { transition: opacity 150ms; }
  .tl-appbar__lockup { display: none; flex-direction: column; justify-content: center; overflow: hidden; white-space: nowrap; transition: opacity 150ms; }
  .tl-appbar__word { font: 500 21px/24px var(--font-display); font-variation-settings: "SOFT" 100; color: var(--ink); }
  .tl-appbar__lockup .tl-tagline { font-size: 12px; line-height: 16px; margin: 0; }
  /* The tagline never gets cut off: when the bar is too narrow for all of it (with the buttons beside it), it is left out. */
  @container bartext (max-width: 186px) { .tl-appbar__lockup .tl-tagline { display: none; } }
  .tl-appbar--lockup .tl-appbar__title { opacity: 0; }
  .tl-appbar--lockup.is-title .tl-appbar__title { opacity: 1; }
  .tl-appbar--lockup.is-title .tl-appbar__lockup { opacity: 0; }
  @container tl-app (max-width: 767px) {
    .tl-appbar__brand { display: inline-flex; align-items: center; }
    .tl-appbar--lockup .tl-appbar__lockup { display: flex; }
  }
  /* Sign-in and setup have no title bar to line up under, so their one column is centered on the page (the app's narrow pages are
     left-aligned under the title bar). */
  .tl-page--bare > * { margin-inline: auto; }
  /* A hidden step must really be hidden: the stack layout's display would otherwise override the hidden attribute. */
  .tl-stack[hidden] { display: none; }
  /* Home opens with the treehouse; it scrolls away with the page and the treehouse's name stays pinned in the title bar. */
  /* The brand guide's picture-with-text: the picture, space-6, the title, space-3, the line under it; all centered, text no wider than 420px. */
  .tl-home-hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding-block: var(--space-4) var(--space-2); }
  .tl-home-hero .tl-art { width: min(240px, 100%); height: auto; margin-bottom: var(--space-6); }
  .tl-home-hero__name { margin: 0 0 var(--space-3); max-width: 420px; font: 420 36px/44px var(--font-display); font-variation-settings: "SOFT" 100; letter-spacing: -.01em; color: var(--ink); text-wrap: balance; overflow-wrap: anywhere; }
  .tl-home-hero__meta { margin: 0; max-width: 420px; font: 400 16px/24px var(--font-sans); color: var(--ink-muted); }
  /* A call to 911 is the one entry in the log about safety: a red edge, a soft red wash and bold text. */
  .tl-log--urgent { background: var(--berry-soft); box-shadow: inset 4px 0 0 var(--berry); }
  .tl-log--urgent .tl-row__title { font-weight: 700; }
  .tl-log--urgent .tl-tag { background: var(--berry); color: var(--canvas); }
  /* Printing the phone book: only the card. */
  @media print {
    .tl-appbar, .tl-nav, .tl-toasts, .tl-footer, .tl-noprint { display: none !important; }
    .tl-app__layout { display: block !important; }
  }
</style>
</head>
<body class="tl-root" style="margin:0">
<div id="root"></div>
<noscript><p class="body" style="padding:var(--space-6)">Treeline needs JavaScript to run. Please turn it on and reload.</p></noscript>
<script src="/ui/js/treeline.js"></script>
<script src="/config.js"></script>
<script type="module" src="/parent/js/app.js"></script>
</body>
</html>
