<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treeline</title>
<meta name="description" content="Treeline: safe calls for neighborhood kids, with parents holding the keys.">
<meta name="theme-color" content="#f0e7d3">
<link rel="stylesheet" href="/ui/css/tokens.css">
<link rel="stylesheet" href="/ui/css/treeline.css">
<link rel="icon" href="/ui/logo/exports/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/ui/logo/exports/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/ui/logo/exports/apple-touch-icon.png">
<link rel="manifest" href="/parent/manifest.webmanifest">
<style>
  /* Empty message slots take no room, so they don't add a gap in a form. */
  [data-error]:empty, [id$="-error"]:empty, #dev-note:empty { display: none; }
  /* A call to 911 is the one entry in the log about safety: a red edge, a soft red wash and bold text. */
  .tl-log--urgent { background: var(--berry-soft); box-shadow: inset 4px 0 0 var(--berry); }
  .tl-log--urgent .tl-row__title { font-weight: 700; }
  .tl-log--urgent .tl-tag { background: var(--berry); color: var(--canvas); }
  /* Printing the phone book: only the card. */
  @media print {
    .tl-appbar, .tl-nav, .tl-toasts, .tl-footer, .tl-noprint { display: none !important; }
    .tl-app__layout { display: block !important; }
  }
</style>
</head>
<body class="tl-root" style="margin:0">
<div id="root"></div>
<noscript><p class="body" style="padding:var(--space-6)">Treeline needs JavaScript to run. Please turn it on and reload.</p></noscript>
<script src="/ui/js/treeline.js"></script>
<script src="/config.js"></script>
<script type="module" src="/parent/js/app.js"></script>
</body>
</html>
