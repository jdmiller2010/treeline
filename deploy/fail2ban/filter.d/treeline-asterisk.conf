# Fail2ban filter for Asterisk's PJSIP: someone guessing SIP accounts.
# UNTESTED against a live server; check it with
#   fail2ban-regex data/logs/messages /etc/fail2ban/filter.d/treeline-asterisk.conf
[Definition]
failregex = Request '(REGISTER|INVITE|OPTIONS)' from '[^']*' failed for '<HOST>:\d+' \(callid: [^)]*\) - (Failed to authenticate|No matching endpoint found|Not found)
ignoreregex =
