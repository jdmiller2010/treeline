; Treeline SIP accounts, production.
; Calls are encrypted: SIP over TLS for phone adapters, DTLS-SRTP for browser
; phones (through Caddy's wss), and SRTP for the audio. Nothing is accepted
; in the clear. The certificate is the one Caddy gets from Let's Encrypt.

[global]
type=global
user_agent=Treeline
default_realm=treeline

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/caddy/certificates/acme-v02.api.letsencrypt.org-directory/@DOMAIN@/@DOMAIN@.crt
priv_key_file=/caddy/certificates/acme-v02.api.letsencrypt.org-directory/@DOMAIN@/@DOMAIN@.key
method=tlsv1_2

; Browser phones connect here (WebSocket over the local web server, via Caddy's /ws).
[transport-ws]
type=transport
protocol=ws
bind=127.0.0.1

[phone-endpoint](!)
type=endpoint
context=from-phones
transport=transport-tls
disallow=all
allow=ulaw,alaw,g722
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
identify_by=auth_username
trust_id_inbound=no
send_pai=no
send_rpid=no
media_encryption=sdes
media_encryption_optimistic=no

[webrtc-endpoint](!)
type=endpoint
context=from-phones
disallow=all
allow=opus,ulaw,alaw
direct_media=no
webrtc=yes
rtp_symmetric=yes
dtls_auto_generate_cert=yes
identify_by=auth_username
trust_id_inbound=no
send_pai=no
send_rpid=no

[phone-aor](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

[webrtc-aor](!)
type=aor
max_contacts=1
remove_existing=yes
remove_unavailable=yes
qualify_frequency=20
default_expiration=120
maximum_expiration=300

#include /generated/pjsip_handsets.conf
