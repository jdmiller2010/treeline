# Which Asterisk build runs: rendered by treeline-config from the release's own build id, so a new build is a changed
# configuration file and the restart that makes it run follows from that (docs/DEPLOY_AWS.md).
[Service]
ExecStart=
ExecStart=@ASTERISK_OPT@/@ASTERISK_ID@/sbin/asterisk -mqf -C /etc/asterisk/asterisk-@ASTERISK_ID@.conf
