; Treeline SIP, production, generated by treeline-config. Calls are encrypted: SIP over TLS for phone adapters,
; DTLS-SRTP for browser phones (through Caddy's wss), SRTP for the audio. There is no UDP/TCP SIP transport.
; The certificate is the one Caddy gets (treeline-certsync copies it to /etc/asterisk/keys).
;
; Behind Lightsail's one-to-one NAT the instance has a private address and a static public one, so each
; transport tells Asterisk which address to put in SDP and signalling for peers outside local_net.

[global]
type=global
user_agent=Treeline
default_realm=treeline

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/treeline.crt
priv_key_file=/etc/asterisk/keys/treeline.key
method=tlsv1_2
@NAT_OPTIONS@

; Browser phones connect here (WebSocket over the local web server, via Caddy's /ws).
[transport-ws]
type=transport
protocol=ws
bind=127.0.0.1
@NAT_OPTIONS@

[phone-endpoint](!)
type=endpoint
context=from-phones
transport=transport-tls
disallow=all
allow=ulaw,alaw,g722
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
identify_by=auth_username
trust_id_inbound=no
send_pai=no
send_rpid=no
media_encryption=sdes
media_encryption_optimistic=no

[webrtc-endpoint](!)
type=endpoint
context=from-phones
disallow=all
allow=opus,ulaw,alaw
direct_media=no
webrtc=yes
rtp_symmetric=yes
dtls_auto_generate_cert=yes
identify_by=auth_username
trust_id_inbound=no
send_pai=no
send_rpid=no

[phone-aor](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

[webrtc-aor](!)
type=aor
max_contacts=1
remove_existing=yes
remove_unavailable=yes
qualify_frequency=20
default_expiration=120
maximum_expiration=300

#include /var/lib/treeline/generated/pjsip_handsets.conf
