; /etc/asterisk/asterisk.conf: only what does not depend on which Asterisk build is installed, because this is the file the command
; line reads when an operator types `asterisk -rx ...` (the running daemon reads asterisk-<build>.conf, which also names the build's
; own directories). Rendered by treeline-config.
[directories]
astetcdir => /etc/asterisk
astvarlibdir => /var/lib/treeline/asterisk
astdbdir => /var/lib/treeline/asterisk
astkeydir => /var/lib/treeline/asterisk/keys
astcachedir => /var/lib/treeline/asterisk/cache
astspooldir => /var/lib/treeline/asterisk/spool
astlogdir => /var/lib/treeline/logs/asterisk
astrundir => /run/asterisk

[options]
live_dangerously = no
disable_remote_console_shell = yes
