; The daemon's own asterisk.conf, for Asterisk build @ASTERISK_ID@ (/opt/asterisk/@ASTERISK_ID@). All twelve directories Asterisk
; reads are set explicitly: its compiled-in defaults point at /var/lib/asterisk, which nothing here uses. Everything that
; changes while Asterisk runs (the contact database, logs, spool) is on the state disk, never the system disk.
; Rendered by treeline-config; the unit's drop-in names this file.
[directories]
astetcdir => /etc/asterisk
astmoddir => @ASTERISK_OPT@/@ASTERISK_ID@/lib/asterisk/modules
astsbindir => @ASTERISK_OPT@/@ASTERISK_ID@/sbin
astdatadir => @ASTERISK_OPT@/@ASTERISK_ID@/share/asterisk
astagidir => @ASTERISK_OPT@/@ASTERISK_ID@/share/asterisk/agi-bin
astvarlibdir => /var/lib/treeline/asterisk
astdbdir => /var/lib/treeline/asterisk
astkeydir => /var/lib/treeline/asterisk/keys
astcachedir => /var/lib/treeline/asterisk/cache
astspooldir => /var/lib/treeline/asterisk/spool
astlogdir => /var/lib/treeline/logs/asterisk
astrundir => /run/asterisk

[options]
live_dangerously = no
disable_remote_console_shell = yes
