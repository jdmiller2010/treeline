[general]
enabled=yes
pretty=no
; The controller connects to the events websocket from this origin; without it every connect logs a notice.
allowed_origins=http://127.0.0.1:8088

; The password is generated on this machine at install (/etc/treeline/ari-password) and never leaves it.
[treeline]
type=user
read_only=no
password=@ARI_PASS@
; Defence in depth: only this machine. (Caddy proxies from here, so this does not stop a proxied path: the web server is
; bound to this machine and Caddy never proxies /ari, and a test checks both.)
deny=0.0.0.0/0
permit=127.0.0.1
