; Call audio, production. Keep the range in step with the Lightsail firewall (UDP 10000-10100).
[general]
rtpstart=10000
rtpend=10100
icesupport=yes
strictrtp=yes

; Browser phones negotiate media with ICE. Behind a one-to-one NAT Asterisk would offer its private address as
; a host candidate; this section replaces it with the public one (<private> => <public>). Generated; empty
; when the machine has a public address of its own.
[ice_host_candidates]
@ICE_HOST_CANDIDATES@
