; Treeline SIP accounts.
;
; The accounts for handsets are generated by the API into
; /generated/pjsip_handsets.conf (included at the bottom). Never edit that
; file by hand: parents add and remove handsets in the parent app.

[global]
type=global
user_agent=Treeline

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Browser softphones connect here (WebSocket over the HTTP server, /ws).
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

; ---------- templates ----------
[phone-endpoint](!)
type=endpoint
context=from-phones
disallow=all
allow=g722,ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
identify_by=auth_username
trust_id_inbound=no
send_pai=no
send_rpid=no

[webrtc-endpoint](!)
type=endpoint
context=from-phones
disallow=all
allow=opus,ulaw,alaw
direct_media=no
webrtc=yes
rtp_symmetric=yes
dtls_auto_generate_cert=yes
identify_by=auth_username
trust_id_inbound=no
send_pai=no
send_rpid=no

[phone-aor](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

[webrtc-aor](!)
type=aor
max_contacts=1
remove_existing=yes
remove_unavailable=yes
qualify_frequency=20
default_expiration=120
maximum_expiration=300

#include /generated/pjsip_handsets.conf
