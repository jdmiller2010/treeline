; Treeline SIP accounts.
;
; The accounts for handsets are generated by the API into
; /generated/pjsip_handsets.conf (included at the bottom). Never edit that
; file by hand: parents add and remove handsets in the parent app.

[global]
type=global
user_agent=Treeline
; The realm in the first challenge, before Asterisk knows which handset is
; asking. It must match the realm the stored digests were made with
; (SIP_REALM in controller/treeline/db.py), or a browser phone fails to sign in.
default_realm=treeline

; The PJSIP task pool is not allowed to shrink. A shrink that overlaps a `module reload res_pjsip.so` while contacts are
; being qualified can deadlock all SIP processing (asterisk/asterisk#2314, unfixed in 24.0.0), and the controller reloads
; res_pjsip after every handset change. Read at start only.
[system]
type=system
taskpool_idle_timeout=0

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Browser softphones connect here (WebSocket over the HTTP server, /ws).
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

; ---------- templates ----------
[phone-endpoint](!)
type=endpoint
context=from-phones
disallow=all
allow=g722,ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
identify_by=auth_username
trust_id_inbound=no
send_pai=no
send_rpid=no

[webrtc-endpoint](!)
type=endpoint
context=from-phones
disallow=all
allow=ulaw,alaw
direct_media=no
webrtc=yes
rtp_symmetric=yes
dtls_auto_generate_cert=yes
identify_by=auth_username
trust_id_inbound=no
send_pai=no
send_rpid=no

[phone-aor](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

[webrtc-aor](!)
type=aor
max_contacts=1
remove_existing=yes
remove_unavailable=yes
qualify_frequency=20
default_expiration=120
maximum_expiration=300

#include /generated/pjsip_handsets.conf
