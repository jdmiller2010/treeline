; Kid Phone Network - SIP accounts for the test phones.
; Dev passwords only. Change them before exposing this server to the internet.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ---------- templates ----------
[phone-endpoint](!)
type=endpoint
context=from-phones
disallow=all
allow=g722,ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

[phone-auth](!)
type=auth
auth_type=userpass

[phone-aor](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

; ---------- 1001: Sam (Jordan's house) ----------
[1001](phone-endpoint)
auth=1001
aors=1001
callerid="Sam" <1001>
[1001](phone-auth)
username=1001
password=dev-1001
[1001](phone-aor)

