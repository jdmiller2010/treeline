; Classic North American phone sounds, so Treeline feels like an old phone.
; The control app plays these by name over ARI ("tone:busy"). Never put a raw
; tone string in an ARI media list: its commas are read as list separators.
; The softphone and the phone adapters make their own dial tone.

[general]
country=us

[us]
description = United States / North America
ringcadence = 2000,4000
; Dial tone, when you lift the handset.
dial = 350+440
; Ringback, what the caller hears while it rings.
ring = 440+480/2000,0/4000
; Busy: the other line is in use.
busy = 480+620/500,0/500
; Fast busy: nothing can be done right now.
congestion = 480+620/250,0/250
; The three rising tones that come before an operator recording.
sit = !913/274,!1371/274,!1777/380,0
callwaiting = 440/300,0/10000
; Three short pips, a minute before a call reaches its length limit.
pips = !1400/120,!0/180,!1400/120,!0/180,!1400/120,0
; A click and a soft tone when another handset joins a call.
join = !1000/80,!0/80,!660/200,0
; The ring a parent hears from "Ring test".
ringtest = !440+480/500,!0/300,!440+480/500,0
