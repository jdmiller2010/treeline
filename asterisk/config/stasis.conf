; The task pool Stasis (and so ARI, the controller's events) runs on is not allowed to shrink: the same shrink deadlock as PJSIP's
; (asterisk/asterisk#2314, unfixed in 24.0.0) applies to any task pool, and the controller is a constant ARI client. 0 turns the
; periodic shrink off; the pool then keeps the threads it grew under load, which at our size is a handful. Read at start only.
[taskpool]
idle_timeout_sec=0
