[general]
enabled=yes
pretty=yes
; The controller connects to the events websocket from this origin; without it every connect logs a notice.
allowed_origins=http://127.0.0.1:8088

; The control app and the API log in with this account. Dev password only.
[treeline]
type=user
read_only=no
password=treeline-dev
; Only the machine itself (the controller and the API run on the host network). Defence in depth: the real control is that
; nothing outside the host can reach port 8088's /ari.
deny=0.0.0.0/0
permit=127.0.0.1
