; Every call from a kid phone goes to the control app, which decides
; whether it connects. Asterisk itself never routes calls on its own.

[general]
static=yes
writeprotect=yes

[from-phones]
exten => _X!,1,NoOp(Kid phone call from ${CALLERID(num)} to ${EXTEN})
 same => n,Stasis(kidphone)
 same => n,Hangup()
