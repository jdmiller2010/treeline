; Every call from a handset goes to the control app, which decides whether
; it connects. Asterisk itself never routes calls on its own.

[general]
static=yes
writeprotect=yes

[from-phones]
exten => _X!,1,NoOp(Handset ${CALLERID(num)} dialed ${EXTEN})
 same => n,Stasis(treeline)
 same => n,Hangup()
