; Exactly the modules in asterisk/build/modules.txt, which is all the artifact contains. autoload is off and every module is
; `require`d: a module that fails to load stops Asterisk, instead of leaving it running and deaf (`load` would only log it).
; The order puts what others depend on first; res_sorcery_config must come before res_ari (ARI's configuration is read
; through sorcery and res_ari does not declare that). A test keeps this file and modules.txt the same set.
[modules]
autoload=no
require => res_sorcery_config.so
require => res_sorcery_memory.so
require => res_sorcery_astdb.so
require => res_timing_timerfd.so
require => res_pjproject.so
require => res_pjsip.so
require => res_pjsip_session.so
require => res_pjsip_pubsub.so
require => res_http_websocket.so
require => res_websocket_client.so
require => pbx_config.so
require => app_stasis.so
require => func_callerid.so
require => res_stasis.so
require => res_stasis_answer.so
require => res_stasis_playback.so
require => res_stasis_recording.so
require => res_stasis_snoop.so
require => res_ari.so
require => res_ari_model.so
require => res_ari_asterisk.so
require => res_ari_channels.so
require => res_ari_bridges.so
require => res_ari_playbacks.so
require => res_ari_endpoints.so
require => res_ari_events.so
require => chan_pjsip.so
require => res_pjsip_authenticator_digest.so
require => res_pjsip_endpoint_identifier_user.so
require => res_pjsip_registrar.so
require => res_pjsip_sdp_rtp.so
require => res_pjsip_transport_websocket.so
require => res_pjsip_nat.so
require => res_pjsip_caller_id.so
require => res_rtp_asterisk.so
require => res_srtp.so
require => bridge_simple.so
require => bridge_softmix.so
require => chan_bridge_media.so
require => codec_ulaw.so
require => codec_alaw.so
require => codec_g722.so
require => codec_resample.so
