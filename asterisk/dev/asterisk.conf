; The dev Asterisk's directories: all twelve that Asterisk reads, set explicitly (its compiled-in defaults point at /var/lib/asterisk,
; which the artifact does not use). entrypoint.sh fills in @PREFIX@ with /opt/asterisk/<id> and installs this as /etc/asterisk/asterisk.conf.
[directories]
astetcdir => /etc/asterisk
astmoddir => @PREFIX@/lib/asterisk/modules
astsbindir => @PREFIX@/sbin
astdatadir => @PREFIX@/share/asterisk
astagidir => @PREFIX@/share/asterisk/agi-bin
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astcachedir => /var/cache/asterisk
astspooldir => /var/spool/asterisk
astlogdir => /var/log/asterisk
astrundir => /run/asterisk

[options]
live_dangerously = no
disable_remote_console_shell = yes
